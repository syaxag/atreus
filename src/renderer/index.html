<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!--
      Lista blanca de imágenes. Solo entran los CDN de los que Atreus enseña
      contenido: carátulas e iconos de logros de Steam, capturas incrustadas en
      las guías de la comunidad, imágenes de las wikis y de los catálogos de
      mods. Todo lo demás se bloquea, y `script-src 'self'` impide que una guía
      traiga código: el texto que se lee aquí viene de webs de terceros.
    -->

      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: atreus: https://cdn.cloudflare.steamstatic.com https://shared.cloudflare.steamstatic.com https://shared.akamai.steamstatic.com https://media.steampowered.com https://steamcdn-a.akamaihd.net https://images.steamusercontent.com https://steamuserimages-a.akamaihd.net https://community.fastly.steamstatic.com https://community.akamai.steamstatic.com https://community.cloudflare.steamstatic.com https://static.wikia.nocookie.net https://commons.wiki.gg https://gamebanana.com https://images.gamebanana.com https://gcdn.thunderstore.io https://cdn.modrinth.com; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>Atreus</title>
  </head>

    <script type="module" src="/main.tsx"></script>
  </body>
